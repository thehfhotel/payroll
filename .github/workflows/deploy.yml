name: Build, push, and deploy payroll

on:
  push:
    branches: [main]
    # Mirror of the paths-filter union below: a push touching ONLY the
    # reimbursement app (not its shared contract) never spins this workflow.
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'KBIZTemplateAddPayrollAccount.xlsx'
      - 'KBIZTemplateUploadPayroll.xlsx'
      - 'kbiz-bot/**'
      - 'reimbursement/packages/shared/**'
      - 'docker-compose.yml'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy.yml'
  # PR-time run of `test` only (kbiz-bot typecheck + the root shared-contract
  # suite) so a broken KBIZ contract is a merge-blocking check, not something
  # discovered after main already moved. build-payroll/build-kbiz-bot/deploy
  # explicitly exclude pull_request (push and manual workflow_dispatch still
  # build/deploy as before) — see their `if:` guards below.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mirrors the new-hotel Phase-1 pattern (docs/runbook-deploy-modernization.md
# in that repo):
#   • Build images on GH-hosted ubuntu-latest
#   • Push to ghcr.io
#   • Deploy step SSHes to evergreen as the unprivileged `deploy` user via
#     the `asgard` Cloudflare tunnel; authorized_keys pins the SSH key to
#     /srv/run-deploy-payroll.sh (forced-command), so the workflow can only
#     trigger that one script.
# No self-hosted runner involved — CI no longer shares a host with prod.

env:
  REGISTRY: ghcr.io

# Deploy serialization moved to the DEPLOY JOB (same shared group as
# deploy-reimbursement.yml's deploy job): two pipelines' BUILDS may run
# concurrently — only the ssh/compose window on evergreen must never
# interleave. Workflow-level grouping made a reimbursement deploy wait
# through payroll's builds too, which was pure lost wall-clock.

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      payroll: ${{ steps.filter.outputs.payroll }}
      kbiz: ${{ steps.filter.outputs.kbiz }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: filter
        # Each filter is the COMPLETE list of paths whose change MUST trigger
        # the corresponding job. Paths NOT covered by any filter (e.g. *.md,
        # data/*) cause every job to skip — correct for doc-only commits.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            payroll:
              - 'src/**'
              - 'test/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - 'KBIZTemplateAddPayrollAccount.xlsx'
              - 'KBIZTemplateUploadPayroll.xlsx'
            kbiz:
              - 'kbiz-bot/**'
              # the bot imports the contract from the reimbursement subtree —
              # a shared change must rebuild the bot image too
              - 'reimbursement/packages/shared/**'
              # kbiz-bot/Dockerfile's whole @reimbursement/shared resolution
              # strategy (node_modules symlink vs COPYing tsconfig.json) is
              # conditioned on what this file excludes from the build context.
              - '.dockerignore'
            deploy:
              - 'docker-compose.yml'
              - 'scripts/deploy/**'
              - '.github/workflows/deploy.yml'

  test:
    needs: changes
    # Runs whenever code changed, in either image — the suite covers both
    # src/ and kbiz-bot/, and it's seconds. Doc-only commits skip it.
    if: needs.changes.outputs.payroll == 'true' || needs.changes.outputs.kbiz == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Guard the invariant kbiz-bot's tsconfig `paths` mapping silently
      # relies on: root `bun install` has no `workspaces` in package.json, so
      # it never walks into reimbursement/ — @reimbursement/shared resolves
      # here only because it has zero third-party imports today. A dependency
      # added there would pass reimbursement's own CI (its bun.lock has it)
      # while breaking THIS install with an unresolved-import stack trace
      # pointing at a file in another app.
      - name: Contract must stay dependency-free
        run: |
          if grep -rnE "from ['\"][^./]" reimbursement/packages/shared/src; then
            echo "::error::@reimbursement/shared gained a third-party import — root 'bun install' cannot resolve it (root package.json has no workspaces)"
            exit 1
          fi

      # Covers payroll-form: bun test at root only sees src/ and test/ (no
      # workspaces), so kbiz-bot's own suite runs separately below.
      - run: bun test

      # kbiz-bot has its own package.json + committed bun.lock (not a bun
      # workspace member of root) — install and typecheck it independently.
      # This is the compile-time half of the shared-contract guarantee
      # kbiz-bot/tsconfig.json documents; nothing invoked it before this.
      # `playwright` here has no postinstall script (verified: its installed
      # package.json carries no "scripts" key), so this does not trigger a
      # Chromium download.
      - name: Install kbiz-bot dependencies
        run: bun install --frozen-lockfile
        working-directory: kbiz-bot

      - name: Typecheck kbiz-bot
        run: bun run typecheck
        working-directory: kbiz-bot

  build-payroll:
    needs: [changes, test]
    # Not on pull_request — it exists so `test` (and its kbiz-bot typecheck)
    # gates a PR before merge; a PR must NOT push images or reach deploy.
    # push and workflow_dispatch (manual re-deploy) both still build.
    if: needs.changes.outputs.payroll == 'true' && github.event_name != 'pull_request'
    # Serializes pushes to the MUTABLE :latest tag. Without this, a burst of
    # near-simultaneous merges runs multiple build-payroll instances
    # concurrently; they race to push `payroll:latest`, and the older
    # commit's push can land after the newer one's — evergreen's compose
    # pulls :latest, so every later `docker compose up` (this workflow's own
    # deploy job included) then serves the OLDER image regardless of which
    # commit's deploy job actually ran last. cancel-in-progress stays false:
    # canceling mid-push can leave a half-pushed manifest. This mirrors the
    # existing `deploy-evergreen` group below one job earlier in the
    # pipeline — same race, just one stage upstream of it.
    concurrency:
      group: build-payroll-latest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          # Image names below are LITERALS, deliberately decoupled from the
          # repo name (repo renamed payroll → HF-finance 2026-08-12 →
          # hf-finance 2026-08-13): GHCR packages keep their names and
          # evergreen's compose pulls these exact strings. Renaming the
          # packages would orphan sha history and require a synchronized
          # compose+prod change — don't.
          #
          # This note lives ABOVE `tags:`, never inside it: every line of that
          # block is a tag literal, not YAML, so a `#` line there ships to
          # buildx as `invalid tag "# Image names are LITERALS"` and fails the
          # build. It did, on the first payroll-path commit after the comment
          # landed — paths filtering had kept the job from running until then.
          tags: |
            ${{ env.REGISTRY }}/thehfhotel/payroll:latest
            ${{ env.REGISTRY }}/thehfhotel/payroll:${{ github.sha }}
          # `scope: payroll` isolates GHA cache namespace from kbiz-bot.
          cache-from: type=gha,scope=payroll
          cache-to: type=gha,mode=max,scope=payroll

  build-kbiz-bot:
    needs: [changes, test]
    # Not on pull_request — see build-payroll's comment.
    if: needs.changes.outputs.kbiz == 'true' && github.event_name != 'pull_request'
    # Same :latest-tag race as build-payroll, own concurrency group since
    # the two images are independent and shouldn't queue behind each other.
    concurrency:
      group: build-kbiz-bot-latest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: kbiz-bot/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/thehfhotel/payroll-kbiz-bot:latest
            ${{ env.REGISTRY }}/thehfhotel/payroll-kbiz-bot:${{ github.sha }}
          cache-from: type=gha,scope=kbiz-bot
          cache-to: type=gha,mode=max,scope=kbiz-bot

  deploy:
    concurrency:
      group: deploy-evergreen
      cancel-in-progress: false
    needs: [changes, test, build-payroll, build-kbiz-bot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Allow deploy when:
    #   - at least one image rebuilt successfully, OR
    #   - only deploy-scoped files changed (re-roll existing :latest images)
    # Always require test + build jobs to be success-or-skipped (never failed).
    # The test guard is load-bearing: a failed `test` SKIPS both builds, and
    # "skipped" alone would otherwise read as permission to re-roll :latest.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.build-payroll.result == 'success' || needs.build-payroll.result == 'skipped') &&
      (needs.build-kbiz-bot.result == 'success' || needs.build-kbiz-bot.result == 'skipped') &&
      (needs.build-payroll.result == 'success' ||
       needs.build-kbiz-bot.result == 'success' ||
       (needs.changes.outputs.deploy == 'true' &&
        needs.changes.outputs.payroll != 'true' &&
        needs.changes.outputs.kbiz != 'true'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cloudflared
        # Reaches evergreen via the same `asgard` tunnel the operators use
        # for daily SSH. No CF Access app gates evergreen, so no service token.
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install SSH key + known_hosts
        env:
          SSH_KEY:  ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.EVERGREEN_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"  > ~/.ssh/deploy_key  && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH to evergreen
        env:
          # GITHUB_TOKEN's packages:read scope is enough for `docker pull` from
          # this repo's GHCR images. Token expires when the run ends, so no
          # long-lived credential lives on evergreen.
          GHCR_USER:         ${{ github.actor }}
          GHCR_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          KBIZ_USERNAME:     ${{ secrets.KBIZ_USERNAME }}
          KBIZ_PASSWORD:     ${{ secrets.KBIZ_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Card login (HF ID central service). READER_RESOLVE_SECRET is the
          # real secret — unset ⇒ card login stays dark (503). The other two are
          # non-secret defaults; `|| '<default>'` keeps an unset GH secret from
          # writing an empty value that would override the app's code default.
          READER_RESOLVE_SECRET: ${{ secrets.READER_RESOLVE_SECRET }}
          HF_ID_BASE_URL:        ${{ secrets.HF_ID_BASE_URL || 'http://192.168.100.228:5000' }}
          HF_ID_ISSUER:          ${{ secrets.HF_ID_ISSUER || 'https://id.thehfhotel.org/oidc' }}
        run: |
          set -euo pipefail
          tar -czf /tmp/deploy.tar.gz docker-compose.yml

          jq -n \
            --arg commit_sha            "$GITHUB_SHA" \
            --arg deploy_payload_b64    "$(base64 -w0 < /tmp/deploy.tar.gz)" \
            --arg ghcr_user             "$GHCR_USER" \
            --arg ghcr_token            "$GHCR_TOKEN" \
            --arg KBIZ_USERNAME         "$KBIZ_USERNAME" \
            --arg KBIZ_PASSWORD         "$KBIZ_PASSWORD" \
            --arg SLACK_WEBHOOK_URL     "${SLACK_WEBHOOK_URL:-}" \
            --arg READER_RESOLVE_SECRET "${READER_RESOLVE_SECRET:-}" \
            --arg HF_ID_BASE_URL        "$HF_ID_BASE_URL" \
            --arg HF_ID_ISSUER          "$HF_ID_ISSUER" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token },
              env: {
                KBIZ_USERNAME:         $KBIZ_USERNAME,
                KBIZ_PASSWORD:         $KBIZ_PASSWORD,
                SLACK_WEBHOOK_URL:     $SLACK_WEBHOOK_URL,
                READER_RESOLVE_SECRET: $READER_RESOLVE_SECRET,
                HF_ID_BASE_URL:        $HF_ID_BASE_URL,
                HF_ID_ISSUER:          $HF_ID_ISSUER,
              }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org
