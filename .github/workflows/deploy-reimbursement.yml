name: Reimbursement Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'reimbursement/**'
      - '.github/workflows/deploy-reimbursement.yml'
  workflow_dispatch:

# Serialize deploys so two back-to-back pushes to main don't have their
# `docker compose up` interleave. cancel-in-progress is OFF — an in-flight
# deploy already pulled images and may be mid-migration.
#
# SAME group as deploy.yml's (root payroll+kbiz-bot pipeline): both stacks
# bind-mount the one shared /home/deploy/kbiz-queue dir on evergreen, so the
# two rollouts must queue against each other, not run concurrently.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: thehfhotel
  API_IMAGE: thehfhotel/payroll-reimbursement-api
  WEB_IMAGE: thehfhotel/payroll-reimbursement-web

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Build the api + web images and push to GHCR.
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # api and web build in PARALLEL jobs — they were serial in one job, which
    # put web's build time entirely on the critical path for nothing. Cache
    # scopes were already per-image, so the split costs only runner setup.
    strategy:
      matrix:
        include:
          - app: api
            image: thehfhotel/payroll-reimbursement-api
            dockerfile: ./reimbursement/Dockerfile.api
            scope: reimbursement-v2-api
          - app: web
            image: thehfhotel/payroll-reimbursement-web
            dockerfile: ./reimbursement/Dockerfile.web
            scope: reimbursement-v2-web
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: ./reimbursement
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          platforms: linux/amd64

  contract:
    name: Root contract check (packages/shared)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres for reimbursement's own test suite (added 2026-08-16 with the
    # share-inbox feature). The share-token tests cover a credential that is
    # accepted from the open internet — revocation actually taking effect, and
    # one employee being unable to revoke another's token — so they gate the
    # DEPLOY, not just PR CI. Without this service they would silently skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reimbursement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: latest

      # Repo root has no `workspaces` in package.json — this installs only
      # payroll-form's own deps; kbiz-bot has its own lockfile and installs
      # separately in deploy.yml's test job.
      - name: Install (repo root)
        run: bun install --frozen-lockfile

      - name: Root test suite (covers kbiz-bot/test/shared-contract.test.ts)
        run: bun test

      # The typecheck that used to run INSIDE Dockerfile.api's build stage —
      # here it costs zero wall-clock (this job finishes well inside the image
      # builds' shadow) instead of ~15s on the api image's critical path.
      - name: Reimbursement typecheck
        working-directory: reimbursement
        run: |
          bun install --frozen-lockfile
          bun --filter api db:generate
          bun run typecheck

      - name: Reimbursement migrations (test database)
        working-directory: reimbursement/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reimbursement_test
        run: bunx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Reimbursement test suite
        working-directory: reimbursement
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reimbursement_test
        run: bun run test

  # ──────────────────────────────────────────────────────────────────────
  # Deploy to evergreen via SSH from a GitHub-hosted runner.
  #
  # Connection path:  GH-hosted runner → cloudflared (Cloudflare Access
  # service token) → SSH (deploy user, ed25519 key) → evergreen.
  # ──────────────────────────────────────────────────────────────────────
  deploy:
    concurrency:
      group: deploy-evergreen
      cancel-in-progress: false
    name: Deploy to evergreen
    runs-on: ubuntu-latest
    needs: [build, contract]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    env:
      SSH_HOST: evergreen.thehfhotel.org
      SSH_USER: reimbursement-v2
      DEPLOY_DIR: /home/reimbursement-v2/production

    steps:
      - name: Checkout (compose file only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            reimbursement/docker-compose.production.yml
          sparse-checkout-cone-mode: false

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL --output /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH (key + known_hosts + cloudflared ProxyCommand)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REIMB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.REIMB_SSH_KNOWN_HOSTS }}
          # Optional Cloudflare Access service token. Only needed if the
          # evergreen SSH cloudflared tunnel has an Access app enforcing
          # auth. If unset, cloudflared routes through the tunnel without
          # presenting headers — relying on SSH key auth for security.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for var in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::required secret $var is empty — see DEPLOYMENT.md for setup"
              exit 1
            fi
          done

          umask 077
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Build the ProxyCommand. If a service token is configured, include
          # it; otherwise cloudflared just routes through the tunnel.
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            PROXY="cloudflared access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}"
          else
            PROXY="cloudflared access ssh --hostname %h"
          fi

          cat > ~/.ssh/config <<EOF
          Host evergreen
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ServerAliveCountMax 3
            # Force public-key only. The server's sshd should also have
            # PasswordAuthentication=no, but we lock it down on the client
            # side too so a compromised server config can't downgrade us.
            PreferredAuthentications publickey
            PubkeyAuthentication yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            HostbasedAuthentication no
            GSSAPIAuthentication no
            BatchMode yes
            ProxyCommand ${PROXY}
          EOF
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config

      - name: Smoke-test SSH
        run: ssh evergreen "echo connected as \$(id -un) on \$(hostname)"

      # Closes the race where two near-simultaneous pushes (dependabot bursts
      # are the common case) queue two deploy runs against `concurrency:
      # deploy-evergreen`, and the OLDER commit's run — slower to build, or
      # just second through the gate — finishes its rollout AFTER the newer
      # one and silently overwrites it. Both runs report success; nothing
      # before this checked whether github.sha was still the commit this
      # pipeline should be deploying by the time rollout actually happened.
      # Placed immediately after SSH connectivity is confirmed and BEFORE
      # any remote write (compose sync, .env materialize, GHCR login) — a
      # superseded run must not touch the deploy host's on-disk state at
      # all, since a later out-of-band `docker compose up` on evergreen
      # would otherwise pick that stale state back up.
      #
      # workflow_dispatch bypasses the guard on purpose — a manual redeploy
      # of an older ref (rollback, re-run) is a deliberate override, not a
      # race artifact.
      #
      # main's tip moving is NOT by itself "superseded": this workflow is
      # path-filtered (reimbursement/** or this workflow file only), so a
      # push that only touches e.g. kbiz-bot/ or payroll's src/ advances
      # main's tip without ever scheduling a replacement reimbursement
      # deploy run. Skip only when a commit between here and the tip
      # actually touches a path this workflow triggers on.
      - name: Check HEAD (skip if superseded)
        id: head-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::HEAD guard bypassed — workflow_dispatch redeploy of ${{ github.sha }}"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolving main's tip is best-effort: a transient network/DNS
          # blip must not permanently block the only deploy pipeline for
          # this app, so 3 failed attempts (or a non-sha response) fail
          # OPEN — proceed, with a loud warning — rather than fail closed.
          tip=""
          for attempt in 1 2 3; do
            if tip="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)" \
              && [[ "${tip}" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            echo "::warning::ls-remote attempt ${attempt}/3 for main's tip failed or returned '${tip}', retrying"
            tip=""
            sleep 5
          done

          if [ -z "${tip}" ]; then
            echo "::warning::could not resolve main's tip after 3 attempts — proceeding rather than risk a permanent skip"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tip=${tip}" >> "$GITHUB_OUTPUT"

          if [ "${tip}" = "${{ github.sha }}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main moved past this commit. Ask whether any of the commits in
          # between actually touch this workflow's trigger paths before
          # calling this run superseded.
          if compare_json="$(curl -fsS --retry 3 --retry-delay 5 \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/compare/${{ github.sha }}...${tip}")"; then
            changed="$(echo "${compare_json}" | jq -r '.files[]?.filename // empty')"
          else
            echo "::warning::could not diff ${{ github.sha }}...${tip} — proceeding rather than risk a permanent skip"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "${changed}" | grep -qE '^(reimbursement/|\.github/workflows/deploy-reimbursement\.yml$)'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::deploy skipped: ${{ github.sha }} superseded by ${tip} (a later commit touches reimbursement/ or this workflow)"
          else
            echo "::notice::main moved to ${tip}, but nothing since ${{ github.sha }} touches this pipeline's trigger paths — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Named so the skip is visible at a glance in the run summary, not just
      # as a buried annotation — the whole point is a superseded run must
      # never look like a silent no-op next to the runs that did deploy.
      - name: "Deploy skipped — superseded by newer commit on main"
        if: success() && steps.head-check.outputs.proceed == 'false'
        run: |
          {
            echo "## Deploy skipped — superseded"
            echo ""
            echo "This run built \`${{ github.sha }}\`, but \`main\` had already"
            echo "moved to \`${{ steps.head-check.outputs.tip }}\` by a commit that"
            echo "touches this pipeline. Skipping so this run doesn't overwrite the"
            echo "newer commit's deploy — that run (or the next push) delivers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync compose file
        if: success() && steps.head-check.outputs.proceed != 'false'
        run: |
          set -euo pipefail
          ssh evergreen "mkdir -p ${DEPLOY_DIR}"
          scp reimbursement/docker-compose.production.yml evergreen:${DEPLOY_DIR}/docker-compose.yml

      - name: Materialize .env from secrets
        if: success() && steps.head-check.outputs.proceed != 'false'
        # Keep .env off this runner's disk — it's piped over SSH and written
        # straight into the deploy host with mode 0600.
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN || 'laikaexpress.cloudflareaccess.com' }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # NFC staff-card login → central HF-ID service. The secret is optional:
          # if unset, card login stays disabled (503) and nothing else breaks.
          # Base URL + issuer fall back to the evergreen-LAN defaults.
          READER_RESOLVE_SECRET: ${{ secrets.READER_RESOLVE_SECRET }}
          HF_ID_BASE_URL: ${{ secrets.HF_ID_BASE_URL || 'http://192.168.100.228:5000' }}
          HF_ID_ISSUER: ${{ secrets.HF_ID_ISSUER || 'https://id.thehfhotel.org/oidc' }}
          # Shared terminals, as `email=kiosk-id,…`. The addresses are not
          # secret — they are the same "Kiosk: <id>" Access policies checked
          # into hf-erp's hostnames.json.
          #
          # The two reception PCs only. They were unusable before this (they
          # clear Cloudflare Access as shared Google accounts and then hit a
          # fail-closed 403), so making them kiosks can only improve them.
          #
          # office-1 is deliberately NOT here. It signs in as แอดมิน สำนักงาน
          # today and that works; adding it swaps a working auto-login for a
          # QR screen, which is a regression until someone has actually used
          # the kiosk at reception. Add it once that is proven.
          #
          # Kiosk login was verified end to end against production on
          # 2026-08-10: a LINE scan minted a real session via badge 421.
          KIOSK_EMAILS: ${{ secrets.KIOSK_EMAILS || 'theharbourfront.hotel@gmail.com=reception-1,hfville.hotel@gmail.com=hfville-reception-1' }}
          # Portal notification ingress. Optional: unset means notifications
          # stay off and nothing else changes.
          NOTIFY_INGRESS_TOKEN: ${{ secrets.NOTIFY_INGRESS_TOKEN }}
          HF_ERP_BASE_URL: ${{ secrets.HF_ERP_BASE_URL || 'http://192.168.100.228:4020' }}
          # KBIZ payment automation. Fails dark until the host directory has
          # been provisioned by hand (runbook step 1 — the api gates on
          # `queue/` inside it, which Docker cannot create for you): the
          # "จ่ายผ่าน KBIZ" action answers 503 and the poller never starts,
          # and without the webhook nothing goes to Slack.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Cloudflare Access SERVICE TOKEN for the iPhone share-sheet upload
          # path (CR-2026-08-16). Served to already-authenticated employees on
          # the "เชื่อมต่อมือถือ" screen so the pair never has to be carried to a
          # phone by hand — and so nobody publishes a pre-filled Shortcut via an
          # iCloud link, which would embed these in a publicly fetchable URL.
          #
          # These prove "an HF device", NOT "this person": on their own they can
          # create nothing, because /api/inbox/quick still demands the
          # employee's own share token. That is what makes serving them to staff
          # acceptable where serving a real credential would not be.
          #
          # Optional, and BOTH-OR-NEITHER (see share_setup.ts). Unset ⇒ the
          # screen reports "ask your admin" and iOS setup stays manual; Android
          # is unaffected either way, since it authenticates by the employee's
          # own Access session.
          CF_SHARE_CLIENT_ID: ${{ secrets.CF_SHARE_CLIENT_ID }}
          CF_SHARE_CLIENT_SECRET: ${{ secrets.CF_SHARE_CLIENT_SECRET }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for var in JWT_SECRET CF_ACCESS_AUD POSTGRES_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::required secret $var is empty"
              exit 1
            fi
          done

          # The here-doc is built locally so secrets never appear in shell
          # invocation logs on the remote host.
          ssh evergreen "umask 077 && cat > ${DEPLOY_DIR}/.env && chmod 600 ${DEPLOY_DIR}/.env" <<EOF
          NODE_ENV=production
          IMAGE_TAG=${IMAGE_TAG}

          # Postgres
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=reimbursement

          # API
          DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/reimbursement
          JWT_SECRET=${JWT_SECRET}

          # Cloudflare Access login
          CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
          CF_ACCESS_AUD=${CF_ACCESS_AUD}
          WEB_BASE_URL=https://reimbursement.thehfhotel.org

          # NFC staff-card login (central HF-ID service)
          READER_RESOLVE_SECRET=${READER_RESOLVE_SECRET}
          HF_ID_BASE_URL=${HF_ID_BASE_URL}
          HF_ID_ISSUER=${HF_ID_ISSUER}

          # Shared terminals (email=kiosk-id,…) — a place, not a person
          KIOSK_EMAILS=${KIOSK_EMAILS}

          # HF One portal notifications
          NOTIFY_INGRESS_TOKEN=${NOTIFY_INGRESS_TOKEN}
          HF_ERP_BASE_URL=${HF_ERP_BASE_URL}

          # KBIZ payment automation. Fixed literal, NOT a secret: this same
          # path is also the payroll/kbiz-bot stack's compose default
          # (docker-compose.yml) and the queue dir kbiz-bot actually watches.
          # It was previously overridable here via a repo secret while the
          # payroll stack's own workflow had no way to read that same
          # secret — a GH secret named KBIZ_QUEUE_HOST_DIR would silently
          # split the two stacks onto different directories with no error
          # anywhere (see root CLAUDE.md's "Evergreen gotchas"). If this
          # path ever needs to change, change it in BOTH docker-compose.yml
          # (root) and here, together, in the same commit.
          KBIZ_QUEUE_HOST_DIR=/home/deploy/kbiz-queue
          SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}

          # iPhone share-sheet upload — Cloudflare Access service token.
          # Optional and both-or-neither; unset leaves iOS setup manual.
          CF_SHARE_CLIENT_ID=${CF_SHARE_CLIENT_ID}
          CF_SHARE_CLIENT_SECRET=${CF_SHARE_CLIENT_SECRET}
          EOF

      - name: Log in to GHCR (on remote host)
        if: success() && steps.head-check.outputs.proceed != 'false'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh evergreen "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

      - name: Pull images and roll out
        if: success() && steps.head-check.outputs.proceed != 'false'
        run: |
          set -euo pipefail
          ssh evergreen <<'REMOTE'
          set -euo pipefail
          cd /home/reimbursement-v2/production
          docker compose pull
          docker compose up -d --remove-orphans
          REMOTE

      - name: Health check
        if: success() && steps.head-check.outputs.proceed != 'false'
        # NB: avoid `exit 0` mid-heredoc — that closes ssh's stdin while the
        # local end is still writing the rest of the script, which yields
        # SIGPIPE and a non-zero ssh exit. Track outcomes in flags and let
        # the script reach its natural end.
        run: |
          set -euo pipefail
          ssh evergreen <<'REMOTE'
          set -uo pipefail

          api_ok=0
          for i in $(seq 1 30); do
            if docker exec reimbursement-v2-api curl -fsS --max-time 3 http://localhost:3001/health >/dev/null 2>&1; then
              echo "api healthy after ${i}s"
              api_ok=1
              break
            fi
            sleep 2
          done

          if [ "$api_ok" != 1 ]; then
            echo "::error::api /health never came up"
            docker logs --tail=80 reimbursement-v2-api || true
            exit 1
          fi

          # End-to-end via the host port the cloudflared tunnel routes to.
          # Hitting reimbursement.thehfhotel.org would still resolve to the
          # OLD app until the cutover ingress flip — checking 127.0.0.1:5800
          # directly is unambiguous: that's exactly the new web container.
          #
          # /healthz/upstream, NOT /healthz: the bare path is nginx answering
          # for itself (always 200 as long as the container is up) and says
          # nothing about the api behind it — exactly how the 2026-08-10
          # outage hid: all containers "healthy", every /api/ request 502.
          # /healthz/upstream proxies through to the api, same as real
          # traffic and same as the container HEALTHCHECK in
          # docker-compose.production.yml. See apps/web/nginx.conf.
          edge_ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:5800/healthz/upstream >/dev/null 2>&1; then
              echo "web → api healthy on :5800 after ${i}s"
              edge_ok=1
              break
            fi
            sleep 2
          done

          if [ "$edge_ok" != 1 ]; then
            echo "::error::web :5800 health check failed"
            docker logs --tail=80 reimbursement-v2-web || true
            docker logs --tail=80 reimbursement-v2-api || true
            exit 1
          fi

          echo "deploy looks healthy."
          REMOTE

      # Housekeeping AFTER the health gate: pruning inside the rollout step put
      # ~5-8s of dead-image cleanup on the critical path before health checks.
      - name: Prune old images (non-blocking)
        if: success() && steps.head-check.outputs.proceed != 'false'
        run: ssh evergreen "docker image prune -f" || true

      - name: Summary
        if: success() && steps.head-check.outputs.proceed != 'false'
        run: |
          {
            echo "## Reimbursement-v2 deployed"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image tag: \`sha-${{ github.sha }}\` (pinned in .env on host)"
            echo "- URL: https://reimbursement.thehfhotel.org"
          } >> "$GITHUB_STEP_SUMMARY"
